name: instabox-keepalive
on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renew leases
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_LEASE_TTL: "3600"
        run: sh keepalive.sh --once
